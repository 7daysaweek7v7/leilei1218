<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>干饭磊磊2048</title>
<style>
* {margin:0;padding:0;box-sizing:border-box;font-family:"微软雅黑",sans-serif;}
body {
  background: linear-gradient(135deg, #0f4c5c, #2a9d8f);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-top: 20px;
  overflow: hidden;
}
h1 {
  color: #e0f7f4;
  font-size: 32px;
  margin-bottom: 15px;
  letter-spacing: 2px;
  text-shadow: 0 0 10px #ffffff50;
}
.bottom-info {
  position: fixed;
  bottom: 15px;
  right: 20px;
  color: #fff;
  font-size: 16px;
  text-align: right;
  line-height: 1.5;
  background: rgba(0,0,0,0.2);
  padding: 6px 10px;
  border-radius: 6px;
}
.btns {
  margin-bottom: 15px;
  display: flex;
  gap: 12px;
}
.btn {
  padding: 8px 18px;
  font-size: 16px;
  border: none;
  border-radius: 8px;
  background: rgba(255,255,255,0.25);
  color: #fff;
  cursor: pointer;
  transition: 0.2s;
}
.btn:hover {
  background: rgba(255,255,255,0.4);
  transform: scale(1.05);
}
.container {
  background: rgba(255,255,255,0.15);
  padding: 20px;
  border-radius: 16px;
  box-shadow: 0 8px 32px rgba(0,80,70,0.3);
}
.grid {
  display: grid;
  grid-template-columns: repeat(4, 80px);
  gap: 10px;
}
.cell {
  width: 80px;
  height: 80px;
  border-radius: 10px;
  overflow: hidden;
  position: relative;
  background: rgba(255,255,255,0.2);
  transition: all 0.25s ease;
}
.cell.merge-anim{
  animation: shake 0.2s ease;
}
.cell.win-scale {
  transform: scale(1.15);
  z-index: 10;
  box-shadow: 0 0 15px #ffd700;
}
@keyframes shake{
  0%,100%{transform: translateX(0);}
  25%{transform: translateX(-4px);}
  75%{transform: translateX(4px);}
}
.cell img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.num-text {
  position: absolute;
  bottom: 2px;
  right: 4px;
  font-size: 14px;
  font-weight: bold;
  color: #fff;
  text-shadow: 1px 1px 2px #000;
}
.info {
  margin-top: 20px;
  color: #e0f7f4;
  font-size: 16px;
  text-align: center;
}
.score-show{
  color:#fff;
  margin:8px 0;
  font-size:18px;
}
.pop-box{
  display:none;
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.6);
  z-index:999;
  align-items:center;
  justify-content:center;
}
.pop-inner{
  background:#fff;
  padding:30px;
  border-radius:16px;
  text-align:center;
  color:#222;
}
.pop-inner h2{margin-bottom:15px;}
.pop-inner button{
  margin-top:15px;
  padding:8px 20px;
  border:none;
  border-radius:6px;
  background:#2a9d8f;
  color:#fff;
  cursor:pointer;
}
</style>
</head>
<body>

<div class="bottom-info">
  <div>步数：<span id="stepCount">0</span></div>
  <div>用时：<span id="timeUsed">00:00</span></div>
</div>

<h1>🍚干饭磊磊 2048🍚</h1>
<div class="score-show">当前积分：<span id="totalScore">0</span></div>

<div class="btns">
  <button class="btn" id="restartBtn">重新开局</button>
</div>

<div class="container">
  <div class="grid" id="grid"></div>
</div>

<div class="info">好好干饭，轻松合成2048~</div>

<div class="pop-box" id="gamePop">
  <div class="pop-inner">
    <h2 id="popTitle"></h2>
    <p id="popText"></p>
    <button id="popBtn">再来一局</button>
  </div>
</div>

<script>
const size = 4;
let grid = [];
let isWin = false;
let isGameOver = false;
let stepCount = 0;
let totalScore = 0;
let comboNum = 0;
let startTime = null;
let timerInterval = null;

// 严格沿用你原本图片文件名，百分百显示
const imgMap = {
  2: "1.jpg",
  4: "2.jpg",
  8: "3.jpg",
  16: "4.jpg",
  32: "5.jpg",
  64: "6.jpg",
  128: "7.jpg",
  256: "8.jpg",
  512: "9.jpg",
  1024: "10.jpg",
  2048: "11.jpg"
};

const restartBtn = document.getElementById('restartBtn');
const stepCountEl = document.getElementById('stepCount');
const timeUsedEl = document.getElementById('timeUsed');
const totalScoreEl = document.getElementById('totalScore');
const gamePop = document.getElementById('gamePop');
const popTitle = document.getElementById('popTitle');
const popText = document.getElementById('popText');
const popBtn = document.getElementById('popBtn');

let startX = 0;
let startY = 0;

function playMergeSound(){
  let audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  let osc = audioCtx.createOscillator();
  let gain = audioCtx.createGain();
  osc.connect(gain);gain.connect(audioCtx.destination);
  osc.frequency.value=600+comboNum*50;
  gain.gain.value=0.1;
  osc.start();
  gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.15);
  osc.stop(audioCtx.currentTime+0.15);
}

function formatTime(seconds) {
  const m = String(Math.floor(seconds / 60)).padStart(2, '0');
  const s = String(seconds % 60).padStart(2, '0');
  return `${m}:${s}`;
}

function startTimer() {
  if (timerInterval) clearInterval(timerInterval);
  startTime = Date.now();
  timerInterval = setInterval(() => {
    const elapsed = Math.floor((Date.now() - startTime) / 1000);
    timeUsedEl.textContent = formatTime(elapsed);
  }, 1000);
}

function stopTimer() {
  if (timerInterval) clearInterval(timerInterval);
}

restartBtn.addEventListener('click', ()=>resetGame());
popBtn.addEventListener('click', ()=>resetGame());

function resetGame(){
  stopTimer();
  stepCount = 0;
  totalScore = 0;
  comboNum = 0;
  stepCountEl.textContent = stepCount;
  totalScoreEl.textContent = totalScore;
  timeUsedEl.textContent = '00:00';
  gamePop.style.display='none';
  init();
  startTimer();
}

function init() {
  grid = Array(size).fill().map(() => Array(size).fill(0));
  isWin = false;
  isGameOver = false;
  addRandom();
  addRandom();
  render();
}

function addRandom() {
  let empty = [];
  for(let i=0;i<size;i++)
    for(let j=0;j<size;j++)
      if(grid[i][j]===0) empty.push([i,j]);
  if(empty.length===0) return false;
  let [x,y] = empty[Math.floor(Math.random()*empty.length)];
  let r=Math.random();
  if(r<0.08) grid[x][y]=8;
  else if(r<0.15) grid[x][y]=4;
  else grid[x][y]=2;
  return true;
}

function checkGameOver() {
  for(let i=0;i<size;i++)
    for(let j=0;j<size;j++)
      if(grid[i][j]===0) return false;
  for(let i=0;i<size;i++){
    for(let j=0;j<size;j++){
      let cur = grid[i][j];
      if(j<size-1 && cur===grid[i][j+1]) return false;
      if(i<size-1 && cur===grid[i+1][j]) return false;
    }
  }
  return true;
}

function checkWin() {
  for(let i=0;i<size;i++)
    for(let j=0;j<size;j++)
      if(grid[i][j]===2048) return true;
  return false;
}

function render() {
  const el = document.getElementById('grid');
  el.innerHTML = '';
  for(let i=0;i<size;i++){
    for(let j=0;j<size;j++){
      let val = grid[i][j];
      let cell = document.createElement('div');
      cell.className = 'cell';
      if(isWin && val===2048){
        cell.classList.add("win-scale");
      }
      if(val){
        let img = document.createElement('img');
        img.src = imgMap[val];
        cell.appendChild(img);
        let num = document.createElement('div');
        num.className = 'num-text';
        num.innerText = val;
        cell.appendChild(num);
      }
      el.appendChild(cell);
    }
  }
}

function processLine(line) {
  let newLine = line.filter(v => v);
  let merged = [];
  let i = 0;
  let hasMerge = false;
  while (i < newLine.length) {
    if (i + 1 < newLine.length && newLine[i] === newLine[i+1]) {
      let res = newLine[i] * 2;
      merged.push(res);
      totalScore += res * (1+comboNum*0.2);
      hasMerge=true;
      i += 2;
    } else {
      merged.push(newLine[i]);
      i++;
    }
  }
  if(hasMerge) comboNum++;
  else comboNum=0;
  while (merged.length < size) merged.push(0);
  return merged;
}

function moveLeft() {
  for (let i = 0; i < size; i++) {
    grid[i] = processLine(grid[i]);
  }
}

function rotate(){
  let res = Array(size).fill().map(()=>Array(size).fill(0));
  for(let i=0;i<size;i++)
    for(let j=0;j<size;j++)
      res[j][size-1-i] = grid[i][j];
  grid = res;
}

function move(dir){
  if(dir==='left') moveLeft();
  if(dir==='right') {rotate();rotate();moveLeft();rotate();rotate();}
  if(dir==='up') {rotate();rotate();rotate();moveLeft();rotate();}
  if(dir==='down') {rotate();moveLeft();rotate();rotate();rotate();}
}

function afterMove() {
  playMergeSound();
  addRandom();
  render();
  totalScoreEl.textContent=Math.floor(totalScore);
  stepCount++;
  stepCountEl.textContent = stepCount;

  if(!isWin && checkWin()){
    isWin = true;
    stopTimer();
    popTitle.innerText="🎉恭喜 你赢了耶耶耶！";
    popText.innerText=`成功合成2048\n共用步数：${stepCount}\n用时：${timeUsedEl.textContent}\n总积分：${Math.floor(totalScore)}`;
    gamePop.style.display='flex';
  }
  if(checkGameOver()){
    isGameOver = true;
    stopTimer();
    let tips=["干饭人鸭 你输了鸭！","加油口牙^^总能合成哒","哼哼 你输了呀~"];
    let ranTip=tips[Math.floor(Math.random()*tips.length)];
    popTitle.innerText="😯游戏结束";
    popText.innerText=`${ranTip}\n步数：${stepCount}\n积分：${Math.floor(totalScore)}`;
    gamePop.style.display='flex';
  }
}

document.addEventListener('keydown', e=>{
  if(isWin || isGameOver) return;
  let old = JSON.stringify(grid);
  if(e.key==='ArrowLeft') move('left');
  if(e.key==='ArrowRight') move('right');
  if(e.key==='ArrowUp') move('up');
  if(e.key==='ArrowDown') move('down');
  if(JSON.stringify(grid)!==old) afterMove();
});

document.addEventListener('touchstart', e=>{
  if(isWin || isGameOver) return;
  startX = e.touches[0].clientX;
  startY = e.touches[0].clientY;
}, false);

document.addEventListener('touchmove', e=>{
  if(!isWin && !isGameOver) e.preventDefault();
}, { passive: false });

document.addEventListener('touchend', e=>{
  if(isWin || isGameOver) return;
  let endX = e.changedTouches[0].clientX;
  let endY = e.changedTouches[0].clientY;
  let dx = endX - startX;
  let dy = endY - startY;

  let old = JSON.stringify(grid);
  if(Math.abs(dx) > Math.abs(dy)){
    if(dx > 50) move('right');
    else if(dx < -50) move('left');
  } else {
    if(dy > 50) move('down');
    else if(dy < -50) move('up');
  }
  if(JSON.stringify(grid)!==old) afterMove();
});

init();
startTimer();
</script>
</body>
</html>
